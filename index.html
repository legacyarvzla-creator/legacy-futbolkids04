<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FutbolKids AR Pro</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: black; }
        #ui { position: absolute; z-index: 9999; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; padding: 10px 20px; background: rgba(0,0,0,0.6); border-radius: 50px; }
        .btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid white; background: rgba(0,0,0,0.4); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui">
        <button id="recordButton" class="btn">🔴</button>
        <button id="torchButton" class="btn">💡</button>
    </div>

    <video id="miVideo" src="video.mp4" preload="auto" crossorigin="anonymous" playsinline loop style="display:none"></video>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;" renderer="colorManagement: true, alpha: true" vr-mode-ui="enabled: false">
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0"><a-plane src="#miVideo" width="1" height="1.77" material="shader: flat; src: #miVideo;"></a-plane></a-entity>
        </a-scene>

    <script>
        const video = document.querySelector('#miVideo');
        let estaGrabando = false;
        let mediaRecorder, animationFrame;

        // Autorización de audio
        document.addEventListener('click', () => { video.play().then(() => video.pause()); }, {once: true});

        document.querySelectorAll('a-entity[mindar-image-target]').forEach(target => {
            target.addEventListener("targetFound", () => video.play());
            target.addEventListener("targetLost", () => video.pause());
        });

        recordButton.onclick = async () => {
            if (!estaGrabando) {
                // 1. Obtener la cámara (fondo) y el canvas (AR)
                const videoCam = document.querySelector('video:not(#miVideo)');
                const canvasAR = document.querySelector('canvas');
                
                // 2. Crear un canvas de composición
                const canvasComp = document.createElement('canvas');
                canvasComp.width = canvasAR.width;
                canvasComp.height = canvasAR.height;
                const ctx = canvasComp.getContext('2d');

                // 3. Loop de dibujo (Esto pone la cámara atrás y el AR adelante)
                const draw = () => {
                    ctx.drawImage(videoCam, 0, 0, canvasComp.width, canvasComp.height);
                    ctx.drawImage(canvasAR, 0, 0, canvasComp.width, canvasComp.height);
                    animationFrame = requestAnimationFrame(draw);
                };
                draw();

                // 4. Capturar el stream del canvas de composición
                const stream = canvasComp.captureStream(30);
                // Agregar audio del video
                const audioCtx = new AudioContext();
                const source = audioCtx.createMediaElementSource(video);
                const dest = audioCtx.createMediaStreamDestination();
                source.connect(dest);
                stream.addTrack(dest.stream.getAudioTracks()[0]);

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 5000000 });
                let chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    cancelAnimationFrame(animationFrame);
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
                    a.download = 'FutbolKids_Completo.webm';
                    a.click();
                };

                mediaRecorder.start();
                estaGrabando = true;
                recordButton.innerText = "⏹️";
            } else {
                mediaRecorder.stop();
                estaGrabando = false;
                recordButton.innerText = "🔴";
            }
        };
    </script>
</body>
</html>
